# Policy deltas over the tiny kernel type (ktypes/tiny in yocto-kernel-cache,
# built from allnoconfig). tiny already brings PROC_FS, SYSFS, BINFMT_ELF,
# FUTEX, SYSVIPC, UNIX98_PTYS, DEVTMPFS(_MOUNT), PRINTK_TIME, NET, UNIX and
# INET; everything else a switch userspace needs is off.

# Nothing is =m: the image carries no module tree.
# CONFIG_MODULES is not set

# Userspace. allnoconfig turns off everything behind EXPERT, which tiny
# enables: users other than root (dropbear, clixon's clicon user), the
# syscalls Rust's standard library and clixon use, file locks and shared
# memory.
CONFIG_MULTIUSER=y
CONFIG_EPOLL=y
CONFIG_EVENTFD=y
CONFIG_TIMERFD=y
CONFIG_SIGNALFD=y
CONFIG_POSIX_TIMERS=y
CONFIG_FILE_LOCKING=y
CONFIG_SHMEM=y
CONFIG_TMPFS=y
CONFIG_INOTIFY_USER=y
CONFIG_AIO=y
CONFIG_ADVISE_SYSCALLS=y
CONFIG_BINFMT_SCRIPT=y
CONFIG_PROC_SYSCTL=y
CONFIG_TTY=y

# The disk layout (files/wic/qemu-switch-ab.wks.in): GPT, the vfat config
# partitions EFI Boot Guard's tools and SWUpdate mount, a squashfs root slot
# with an overlay whose upper layer is on ext4.
CONFIG_BLOCK=y
CONFIG_PARTITION_ADVANCED=y
CONFIG_EFI_PARTITION=y
CONFIG_MSDOS_FS=y
CONFIG_VFAT_FS=y
CONFIG_FAT_DEFAULT_CODEPAGE=437
CONFIG_FAT_DEFAULT_IOCHARSET="iso8859-1"
CONFIG_NLS=y
CONFIG_NLS_CODEPAGE_437=y
CONFIG_NLS_ISO8859_1=y
# squashfs sits in the "Miscellaneous filesystems" menu, which is off in
# the tiny type, and would silently drop out without it.
CONFIG_MISC_FILESYSTEMS=y
CONFIG_SQUASHFS=y
CONFIG_SQUASHFS_XZ=y
CONFIG_OVERLAY_FS=y
CONFIG_EXT4_FS=y

# What clixon-switch builds: the ports in a VLAN-aware bridge with per-VLAN
# spanning tree states, routed VLAN interfaces on top, udhcpc (raw packet
# sockets) on one of them. IPv4 only, as on the other boards.
CONFIG_PACKET=y
CONFIG_BRIDGE=y
CONFIG_BRIDGE_VLAN_FILTERING=y
CONFIG_VLAN_8021Q=y
# CONFIG_IPV6 is not set

# Not needed on a serial console, and the tiny type would otherwise keep them.
# CONFIG_VT is not set
# CONFIG_FB is not set
# CONFIG_DRM is not set

# The kernel is built on every change to this layer; skip the debug info.
CONFIG_DEBUG_INFO_NONE=y
