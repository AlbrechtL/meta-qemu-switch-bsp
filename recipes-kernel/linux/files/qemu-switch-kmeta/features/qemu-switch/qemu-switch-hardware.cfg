# The virtual hardware scripts/x86-64-q35-qemu (ethernet-switch-os) gives the
# machine: a q35 PC with OVMF. Everything built in; the kernel has no module
# support (qemu-switch-yocto.cfg).

# OVMF starts EFI Boot Guard, which starts the kernel as an EFI application
# from a config partition. ACPI for the q35 chipset and for "poweroff".
CONFIG_ACPI=y
CONFIG_EFI=y
CONFIG_EFI_STUB=y
CONFIG_PCI=y
CONFIG_PCI_MSI=y

# The disk (/dev/vda), the eight front ports and the entropy source.
CONFIG_VIRTIO_MENU=y
CONFIG_VIRTIO=y
CONFIG_VIRTIO_PCI=y
CONFIG_VIRTIO_BLK=y
CONFIG_VIRTIO_NET=y
CONFIG_HW_RANDOM=y
CONFIG_HW_RANDOM_VIRTIO=y

# The console.
CONFIG_SERIAL_8250=y
CONFIG_SERIAL_8250_CONSOLE=y

# EFI Boot Guard arms QEMU's i6300esb before it starts the kernel; busybox
# watchdog keeps feeding it through /dev/watchdog. A system that hangs before
# that, or stops feeding it, is reset -- during the first boot of an update
# that means a rollback. No other watchdog driver, so /dev/watchdog cannot be
# a different one (q35's iTCO).
CONFIG_WATCHDOG=y
CONFIG_I6300ESB_WDT=y

# The system clock from the emulated CMOS clock instead of /etc/timestamp.
CONFIG_RTC_CLASS=y
CONFIG_RTC_DRV_CMOS=y
