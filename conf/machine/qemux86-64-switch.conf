#@TYPE: Machine
#@NAME: Emulated 8 port switch on QEMU x86-64
#@DESCRIPTION: q35 PC with UEFI (OVMF), EFI Boot Guard, eight virtio-net \
#@DESCRIPTION: front ports and a virtio disk with A/B root filesystems.

# Everything oe-core knows about qemux86-64: tune, bzImage, the q35 CPU
# options for runqemu. The settings below go on top of it.
require conf/machine/qemux86-64.conf

# "qemux86-64" keeps oe-core's :qemux86-64 overrides and linux-yocto-tiny's
# COMPATIBLE_MACHINE applying; "qemu-switch" is for recipes of this layer and
# COMPATIBLE_MACHINE = "^qemu-switch$" in the distro layer.
MACHINEOVERRIDES =. "qemux86-64:qemu-switch:"

# Headless: the only console is the serial port, which scripts/qemu-switch
# in ethernet-switch-os connects to the terminal. qemux86-64 adds a second
# getty on ttyS1 and, with USE_VT, one on tty1.
SERIAL_CONSOLES = "115200;ttyS0"
USE_VT = "0"

# Everything is built into the kernel (features/qemu-switch); there is no module
# tree to recommend sound modules from, and no uvesafb for v86d.
MACHINE_EXTRA_RRECOMMENDS = ""
MACHINE_ESSENTIAL_EXTRA_RDEPENDS:remove = "v86d"

# -----------------------------------------------------------------------------
# A/B boot
# -----------------------------------------------------------------------------
# OVMF starts EFI Boot Guard from the ESP. It boots the environment with the
# highest revision from one of the two config partitions BOOT0 and BOOT1, each
# holding a kernel and its command line, and falls back to the other one if
# the first boot of an update does not get confirmed. See
# files/wic/qemu-switch-ab.wks.in for the partitions.
MACHINE_FEATURES += "efi"
EFI_PROVIDER = "efibootguard"

# EFI Boot Guard refuses to boot without a watchdog it can arm. The one it
# arms here is QEMU's i6300esb (scripts/qemu-switch adds the device), fed
# from userspace by busybox watchdog, which meta-efibootguard starts from
# rcS.d/S00watchdog.sh.
EFIBOOTGUARD_WATCHDOG_TIMEOUT ?= "60"
