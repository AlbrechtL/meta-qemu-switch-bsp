BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "qemu-switch-bsp"
BBFILE_PATTERN_qemu-switch-bsp = "^${LAYERDIR}/"
BBFILE_PRIORITY_qemu-switch-bsp = "6"

# efibootguard: the bootloader, its environment tools and the wic plugins
# that lay out the A/B disk (files/wic/qemu-switch-ab.wks.in).
LAYERDEPENDS_qemu-switch-bsp = "core efibootguard"
LAYERSERIES_COMPAT_qemu-switch-bsp = "wrynose"
